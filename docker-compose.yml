x-frontend-limits: &frontend-limits
  cpus: ${FRONTEND_CPU_LIMIT:-0.50}
  mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}

services:
  frontend:
    <<: *frontend-limits
    build:
      context: .
      dockerfile: Dockerfile
    image: lidera-log-academy-site:latest
    container_name: lidera-log-academy-site
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  default:
    name: lidera_log_academy_net
